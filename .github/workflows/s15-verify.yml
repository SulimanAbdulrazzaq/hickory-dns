name: s15-verify
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: tree under test
        run: |
          git log -3 --format='%H %T %s'
          git status --short
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: toolchain
        run: rustc --version && cargo --version
      - name: new test (name_server_pool truncated tests)
        working-directory: crates/resolver
        run: cargo test --locked --lib name_server_pool::tests::test_truncated -- --nocapture --test-threads=1
      - name: stability, new test x100
        if: always()
        working-directory: crates/resolver
        run: |
          fails=0
          for i in $(seq 1 100); do
            cargo test --locked --lib name_server_pool::tests::test_truncated_concurrent_servers_retry_over_tcp -- --exact >/tmp/run.log 2>&1 || fails=$((fails+1))
          done
          echo "failures in 100 runs: $fails"
          [ "$fails" -eq 0 ] || echo "(non-zero failures are expected on the red tree)"
          exit $([ "$fails" -eq 0 ] && echo 0 || echo 1)
      - name: hickory-resolver full crate, default features (cargo test --locked --all-targets)
        if: always()
        working-directory: crates/resolver
        run: cargo test --locked --all-targets --no-fail-fast
      - name: hickory-resolver full crate, all features (cargo test --locked --all-targets --all-features)
        if: always()
        working-directory: crates/resolver
        run: cargo test --locked --all-targets --all-features --no-fail-fast
      - name: rustfmt check (resolver)
        if: always()
        working-directory: crates/resolver
        run: cargo fmt -- --check
      - name: clippy (resolver, default features)
        if: always()
        working-directory: crates/resolver
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (resolver, all features)
        if: always()
        working-directory: crates/resolver
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
